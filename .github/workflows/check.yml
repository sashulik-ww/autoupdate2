name: Check proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xray
        run: |
          set -e
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -O xray.zip
          unzip -q xray.zip -d xray-bin
          sudo install -m 755 xray-bin/xray /usr/local/bin/xray
          rm -rf xray.zip xray-bin
          xray version

      - name: Install sing-box
        run: |
          set -e
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.11.15/sing-box-1.11.15-linux-amd64.tar.gz -O sb.tar.gz
          tar -xzf sb.tar.gz
          sudo install -m 755 sing-box-1.11.15-linux-amd64/sing-box /usr/local/bin/sing-box
          rm -rf sb.tar.gz sing-box-1.11.15-linux-amd64
          sing-box version

      - name: Check proxies
        env:
          TIMEOUT: "8"
          CONCURRENCY: "150"
          XRAY_WORKERS: "6"
          SB_WORKERS: "6"
          MAX_CORE_CANDIDATES: "3000"
          XRAY_TIMEOUT: "9"
        run: python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "Update proxies"
          git pull --rebase origin main || true
          git push origin HEAD:main
