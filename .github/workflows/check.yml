name: Check proxies (SPb)

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:       # ручной запуск

permissions:
  contents: write

concurrency:
  group: proxy-check
  cancel-in-progress: false

jobs:
  check:
    # Runner, установленный на машине в Санкт-Петербурге, с лейблом "spb"
    runs-on: [self-hosted, spb]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Check proxies
        env:
          REQUIRE_SPB: "true"
          CONCURRENCY: "200"
          TIMEOUT: "10"
        run: .venv/bin/python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update proxies: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi


